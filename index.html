<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F5EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<title>Bookshelf</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{ /* --blue 는 --accent 로 통일했다 (별칭은 상위에서 굳어버려 탭 색을 못 따라감) */
  /* 확정 팔레트 (핸드오프 3a — 탭별 서페이스) */
  --primary:#44614F; --primary-deep:#2E4636;
  --rose:#B4635E; --rose-soft:#EFDCD9; --rose-tint:#F3E1DF;
  --rose-ondark:#E7B4B0; --rose-dim:#A15450; --oxblood:#8F3434;
  --ink:#1F2A24; --text:#5F6259; --muted:#8A8B80;
  --line:#E6E4D9; --track:#E6E5DA;
  --surface:#FFFDF7; --soft:#ECEAE0; --dark:#2E4636;

  /* 탭마다 바뀌는 값 — 색을 하드코딩하지 않고 여기 하나로 관리한다 */
  --page:#F7F5EE; --accent:#44614F; --tabaccent:#44614F;
  --on-page:#1F2A24; --on-page-sub:#5F6259;
  --cardbg:#FFFDF7; --cardline:#E6E4D9;

  /* 예전 이름은 새 값으로 이어둔다 — 기존 규칙이 그대로 동작하게 */
  --blue:var(--accent); --blue-light:#C6C5B9;
  --green:#44614F; --terracotta:#B4635E; --coral:#A15450; --purple:#8A8B80;
  --bg:#F7F5EE;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  --r:20px; --rs:14px;
  --shadow:0 2px 14px rgba(31,42,36,.07);
}
#app[data-surface="home"]{--page:#44614F;--accent:#B4635E;--tabaccent:#44614F;
  --on-page:#F7F5EE;--on-page-sub:rgba(247,245,238,.66);
  --cardbg:#F7F5EE;--cardline:transparent}
#app[data-surface="calendar"]{--page:#EFDCD9;--accent:#B4635E;--tabaccent:#B4635E}
#app[data-surface="shelf"]{--page:#F7F5EE;--accent:#44614F;--tabaccent:#1F2A24}
#app[data-surface="settings"]{--page:#F7F5EE;--accent:#44614F;--tabaccent:#8A8B80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;color:var(--text);
  line-height:1.6;letter-spacing:-.01em;background:var(--bg);
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}

#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--page);
  display:flex;flex-direction:column;box-shadow:0 0 40px rgba(31,42,36,.08);
  transition:background .2s ease-out}
#view{flex:1;padding:24px 24px 16px}
/* 탭바는 어느 탭에서나 오프화이트 고정 — 활성 항목만 그 탭 색 */
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;
  display:flex;background:#F7F5EE;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:40}
#tabbar button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#8A8B80}
#tabbar .ic{display:block;font-size:17px;line-height:1;color:#C6C5B9}
#tabbar button.on,#tabbar button.on .ic{color:var(--tabaccent)}

/* 공통 */
h1.head{font-size:26px;font-weight:800;color:var(--on-page);margin:0 0 4px;letter-spacing:-.02em}
p.sub{font-size:13px;color:var(--on-page-sub);margin:0 0 24px}
.sect{font-size:12px;font-weight:800;color:var(--on-page-sub);letter-spacing:.1em;
  margin:32px 0 8px}
.card{background:var(--cardbg);border:1px solid var(--cardline);border-radius:var(--r);padding:16px}
.btn{display:block;width:100%;background:var(--accent);color:#FFFDF7;border-radius:var(--rs);
  padding:18px;min-height:60px;text-align:center;font-size:15px;font-weight:800}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.danger{background:#f7e6e0;color:var(--coral)}
.btn.sm{padding:14px;min-height:52px;font-size:13px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.empty{text-align:center;padding:48px 16px;color:var(--on-page-sub);font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:16px;opacity:.5}
.warn{background:#f7e6e0;border-left:5px solid var(--coral);border-radius:0 var(--rs) var(--rs) 0;padding:14px 16px;margin-bottom:24px;font-size:12px;line-height:1.6;color:#8c4033}

/* 표지 */
.cv{border-radius:8px;display:flex;align-items:flex-end;padding:8px;color:#fff;
  font-size:11px;font-weight:700;line-height:1.3;overflow:hidden;
  box-shadow:0 2px 8px rgba(59,52,44,.18);word-break:keep-all}
.c0{background:linear-gradient(160deg,#a8562f,#7d3d20)}
.c1{background:linear-gradient(160deg,#7f9068,#586848)}
.c2{background:linear-gradient(160deg,#b5894a,#8a6229)}
.c3{background:linear-gradient(160deg,#8a7c6b,#5f5448)}
.c4{background:linear-gradient(160deg,#9c6b5c,#6f463a)}
.c5{background:linear-gradient(160deg,#a35a56,#77393a)}

/* 홈 */
.now{display:flex;gap:16px;background:var(--cardbg);border:1px solid var(--cardline);border-radius:var(--r);padding:16px;margin-bottom:24px}
.now .cv{width:68px;height:94px;flex:none}
.now .t{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 2px;line-height:1.35}
.now .a{font-size:12px;color:var(--muted);margin:0 0 8px}
.bar{height:10px;border-radius:6px;background:#e2d9cb;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
.pg{font-size:11px;color:var(--muted)}
.pgrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.pgpct{font-size:22px;font-weight:800;color:var(--green);letter-spacing:-.02em;line-height:1;flex:none}
/* 오늘 몫 — 딥그린 지면 위라 흰계열 글씨, 강조는 #E7B4B0 */
.quota{background:rgba(247,245,238,.14);border-radius:var(--r) var(--r) 0 0;padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.quota .lb{display:block;font-size:10px;font-weight:800;color:var(--rose-ondark);letter-spacing:.1em}
.quota .vl{display:block;font-size:17px;font-weight:800;color:#F7F5EE}
.quota .rest{font-size:11px;font-weight:700;color:var(--rose-ondark);text-align:right;
  line-height:1.4;flex:none}
.startbtn{background:var(--accent);color:#FFFDF7;border-radius:var(--r);width:100%;
  text-align:center;padding:24px 16px;min-height:88px;margin-bottom:24px;
  box-shadow:0 6px 18px rgba(168,86,47,.24)}
.startbtn.att{border-radius:0 0 var(--r) var(--r)}
.startbtn .big{font-size:19px;font-weight:800;display:block;margin-bottom:2px}
.startbtn .sm{font-size:12px;opacity:.75}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 div{background:var(--cardbg);border:1px solid var(--cardline);border-radius:var(--rs);padding:18px 8px;text-align:center}
.stat3 .v{font-size:19px;font-weight:800;color:var(--ink);display:block}
.stat3 .k{font-size:11px;color:var(--muted)}

/* 타이머 */
#timer{position:fixed;inset:0;background:var(--dark);z-index:60;display:none;
  flex-direction:column;justify-content:center;color:#fff;padding:24px}
#timer.on{display:flex}
#timer .bk{text-align:center;font-size:14px;color:rgba(255,255,255,.6);margin-bottom:26px}
/* 시간과 진행률을 같은 링 안에 둔다 — 읽는 중에도 남은 양이 보이게 */
#timer .ring{width:236px;height:236px;margin:0 auto 16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--green) 0 0%, rgba(255,255,255,.12) 0)}
#timer .ring .in{width:206px;height:206px;border-radius:50%;background:var(--dark);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#timer .clock{text-align:center;font-size:44px;font-weight:200;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;margin:0}
#timer .pgs{font-size:11px;color:rgba(255,255,255,.42);margin:8px 0 0}
#timer .acc{text-align:center;font-size:12px;color:rgba(255,255,255,.45);margin-bottom:44px}
#timer .btns{display:flex;gap:8px;justify-content:center}
#timer .btns button{border-radius:var(--rs);min-height:56px;padding:0 28px;font-size:15px;font-weight:700}
#timer .b1{background:rgba(255,255,255,.14);color:#fff}
#timer .b2{background:#fff;color:var(--dark)}

/* 모달 / 시트 */
#overlay{position:fixed;inset:0;background:rgba(43,52,70,.5);z-index:70;display:none;
  align-items:flex-end;justify-content:center}
#overlay.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:24px 24px 0 0;
  padding:24px 24px 32px;max-height:92vh;overflow:auto}
.sheet h3{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 16px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);
  border-radius:var(--rs);padding:16px;min-height:56px;background:var(--surface);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:72px}
.hint{font-size:11px;color:var(--muted);margin-top:8px}
.chk{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:var(--rs);
  padding:16px;min-height:56px;margin-bottom:16px;cursor:pointer}
.chk .box{width:26px;height:26px;border-radius:8px;background:#e2d9cb;color:#fff;
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on .box{background:var(--green)}
.chk .tx{font-size:14px;font-weight:700;color:var(--ink)}
.swatch{display:flex;gap:8px}
.swatch button{width:44px;height:44px;border-radius:8px;flex:none;opacity:.4}
.swatch button.on{opacity:1;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.cv.ph{background-size:cover;background-position:center;padding:0}
.fin.ph{background-size:cover;background-position:center}
.coverpick{display:flex;gap:16px;align-items:flex-start}
.cvprev{width:80px;height:112px;flex:none}
.cvctl{flex:1;min-width:0}
.cvctl .swatch{margin-top:8px;flex-wrap:wrap}
.cvctl .swatch button{width:32px;height:32px}

/* 책 검색 */
.srch{margin:-8px 0 16px}
.srch .msg{font-size:12px;color:var(--muted);padding:10px 0;line-height:1.5}
.srch .msg.err{color:var(--coral)}
.srch .dots{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;
  margin-right:6px;border:2px solid #e2d9cb;border-top-color:var(--accent);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.srch .list{display:block;border:1px solid var(--line);border-radius:var(--rs);overflow:hidden}
.srch .bkc{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  padding:10px 12px;min-height:64px;border-bottom:1px solid var(--line);background:var(--surface)}
.srch .bkc:last-child{border-bottom:0}
.srch .bkc:active{background:var(--soft)}
.srch .bkc .th{width:36px;height:50px;flex:none;border-radius:4px;
  background-size:cover;background-position:center;box-shadow:0 1px 4px rgba(59,52,44,.22)}
.srch .bkc .tx{flex:1;min-width:0}
.srch .bkc .nm{display:block;font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;
  word-break:keep-all}
.srch .bkc .ap{display:block;font-size:11px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch .bkc .bdg{flex:none;font-size:10px;font-weight:800;color:var(--green);
  background:rgba(127,144,104,.18);border-radius:999px;padding:4px 8px}

/* 출처 */
#credit{text-align:center;font-size:10px;color:var(--on-page-sub);line-height:1.5;
  padding:0 24px 96px;word-break:keep-all}
#credit a{color:var(--on-page-sub)}
</style>
<style>
/* 캘린더 */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mhead .m{font-size:19px;font-weight:800;color:var(--ink)}
.mhead button{min-width:48px;min-height:48px;color:var(--terracotta);font-size:16px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px}
.dow span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px}
.cal .cell{height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px}
.cal .d{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:#A9A79C}
/* 히트맵 그린 스케일 — 범례 스와치도 같은 클래스를 써서 색이 어긋나지 않는다 */
.l1{background:#E9EEE7;color:#2E4636!important}
.l2{background:#C7D6C9;color:#2E4636!important}
.l3{background:#93AE9B;color:#F7F5EE!important}
.l4{background:#44614F;color:#F7F5EE!important}
/* 오늘은 채움색 대신 링으로 표시한다 (읽은 양 색은 그대로 살린다) */
.cal .d.tod{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .fin{width:13px;height:17px;border-radius:2px;
  box-shadow:0 1px 3px rgba(59,52,44,.3),inset 2px 0 0 rgba(255,255,255,.35)}
.legend{display:flex;align-items:center;gap:6px;justify-content:center;margin:16px 0;
  font-size:11px;color:var(--muted)}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.msum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);
  padding-top:16px;margin-top:8px}
.msum div{text-align:center}
.msum .v{font-size:17px;font-weight:800;color:var(--ink);display:block}
.msum .k{font-size:11px;color:var(--muted)}

/* 책장 */
.tabs{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto}
.tabs button{font-size:13px;font-weight:700;color:var(--muted);min-height:48px;padding:0 16px;
  display:inline-flex;align-items:center;
  border-radius:var(--rs);background:var(--soft);white-space:nowrap;flex:none}
.tabs button.on{background:var(--accent);color:#FFFDF7}
/* 책장 — 실제 선반에 책이 꽂힌 모양 */
.srow{margin-bottom:18px}
/* 표지 줄 → 선반 → 글자 줄 순서로 쌓는다.
   선반이 표지 줄의 바로 다음 형제라, 표지가 늘 선반에 정확히 닿는다. */
.sbooks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}
.plank{height:10px;border-radius:2px;
  background:linear-gradient(180deg,var(--surface) 0%,#efe6d9 55%,#ddd2c0 100%);
  box-shadow:0 7px 11px -5px rgba(59,52,44,.30)}
.scaps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:12px}
.shelf .it{display:flex;flex-direction:column;align-items:center;text-align:center}
/* 표지 박스는 모든 책이 82x115로 같다 — 쪽수에 따라 달라지지 않는다 */
.shelf .it .cvwrap{position:relative;width:82px;height:115px}
.shelf .it .cv{width:100%;height:100%;border-radius:2px 4px 4px 2px;
  box-shadow:0 5px 9px -3px rgba(59,52,44,.34),
             inset 3px 0 0 rgba(0,0,0,.14), inset 5px 0 0 rgba(255,255,255,.14)}
.shelf .it .prog{position:absolute;left:0;right:0;bottom:0;height:4px;
  background:rgba(0,0,0,.22);border-radius:0 0 4px 2px;overflow:hidden}
.shelf .it .prog i{display:block;height:100%;background:var(--terracotta)}
/* 제목칸을 2줄 높이로 고정해, 긴 제목이 아랫줄 책을 밀지 않게 한다 */
.scap{text-align:center;display:block;width:100%}
.scap .nm{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3;
  height:34px;overflow:hidden;margin:0;word-break:keep-all}
.scap .au{font-size:10px;color:var(--muted);line-height:1.3;margin:2px 0 0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 책 상세 */
.dhead{display:flex;gap:16px;margin-bottom:24px}
.dhead .cv{width:88px;height:124px;flex:none}
.dhead .t{font-size:19px;font-weight:800;color:var(--ink);margin:0 0 4px;line-height:1.3}
.dhead .a{font-size:13px;color:var(--muted);margin:0 0 12px}
.dhead .gnr{display:inline-block;margin:0 0 12px;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:800;color:var(--green);background:#E9EEE7;border:1px solid var(--line)}
.dhead .gnr.off{color:var(--muted);background:transparent}
.kv{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:12px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;color:var(--ink)}
.stars{font-size:20px;letter-spacing:.1em;color:var(--terracotta)}
.qt{margin-bottom:8px;padding:14px}
.qt .qx{margin:0 0 8px;font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.qt .qm{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.nw{margin-bottom:8px;padding:14px}
.nw .nt{display:block;font-size:14px;font-weight:800;color:var(--ink);margin-bottom:6px}
.nw .nd{margin:0 0 8px;font-size:13px;line-height:1.7;color:var(--text)}
.nw .nx{font-size:12px;color:var(--muted)}
.qt .qm .qb{display:flex;flex:none;gap:2px;margin:-6px -8px -6px 0}
.qt .qm button{font-size:12px;color:var(--muted);padding:6px 8px}
.stars button{color:#e2d9cb;padding:4px 6px}
.stars button.on{color:var(--terracotta)}

/* 플랜 */
.realloc{background:var(--soft);border-radius:var(--rs);padding:16px;margin-bottom:16px;
  display:flex;gap:16px;align-items:flex-start}
.rleft{flex:1;min-width:0}
.rcover{flex:none}
.rcover .cv{width:76px;height:106px}
.realloc .rk{display:block;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:8px}
.realloc .rt{font-size:11px;color:var(--muted);margin:0 0 8px;line-height:1.5}
.realloc .rr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.realloc .rr .to{color:var(--coral)}
.realloc .rr .b{font-weight:800;color:var(--terracotta);font-size:15px}
.pstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pstat div{background:var(--soft);border-radius:var(--rs);padding:14px 8px;text-align:center}
.pstat .v{font-size:16px;font-weight:800;color:var(--ink);display:block}
.pstat .k{font-size:10px;color:var(--muted)}
.pcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.pc{min-height:56px;border-radius:8px;background:var(--soft);display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:2px}
.pc .dt{font-size:12px;font-weight:800;color:var(--ink);line-height:1.4}
.pc .pp{font-size:8px;color:var(--muted);line-height:1.3;text-align:center}
.pc.dim{background:transparent}

/* 완독 도장 — 고무도장을 비스듬히 찍은 모양.

<body>
<div id="app">
  <main id="view"></main>
  <footer id="credit">도서 DB 제공 : 알라딘 인터넷서점(<a href="https://www.aladin.co.kr" target="_blank" rel="noopener">www.aladin.co.kr</a>)</footer>
  <nav id="tabbar"></nav>
</div>
<div id="timer">
  <p class="bk" id="tmBook"></p>
  <div class="ring" id="tmRing"><div class="in">
    <p class="clock" id="tmClock">00:00:00</p>
    <p class="pgs" id="tmPgs"></p>
  </div></div>
  <p class="acc" id="tmAcc"></p>
  <div class="btns">
    <button class="b1" id="tmPause">일시정지</button>
    <button class="b2" id="tmStop">읽기 종료</button>
  </div>
</div>
<div id="overlay"></div>
<script>
/* ============ 저장소 ============ */
var KEY = 'reading-app-v1';
var S = { books: [], sessions: [] };
var SHELF_STEP = 12;   /* 한 번에 보여주는 책 수 (한 줄 3권 x 4줄) */
var UI = { tab: 'home', bookId: null, shelfTab: 'reading', calMonth: null,
           shelfMore: SHELF_STEP };

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p = JSON.parse(raw); S.books = p.books||[]; S.sessions = p.sessions||[]; }
  }catch(e){ console.warn('불러오기 실패', e); }
  normalize();
}
/* 검색 기능이 생기기 전에 등록한 책에는 isbn13·표지URL·출판사가 없다.
   읽을 때마다 확인하지 않아도 되도록 여기서 한 번 빈 값으로 채워둔다. */
function normalize(){
  S.books.forEach(function(b){
    if(typeof b.cover !== 'number') b.cover = 0;
    if(b.author == null)    b.author = '';
    if(b.publisher == null) b.publisher = '';
    if(b.isbn13 == null)    b.isbn13 = '';
    if(b.coverUrl == null)  b.coverUrl = '';
    if(b.genre == null)     b.genre = '';      /* 분야가 없던 시절 책은 미분류 */
    if(!Array.isArray(b.quotes)) b.quotes = [];    /* 남긴 문장 */
  });
}
/* 이 브라우저에서 기록 저장이 되는지 미리 확인한다.
   폰에 파일로 넣어 열면 막히는 경우가 있어서, 조용히 실패하지 않고 알려준다. */
var STORAGE_OK = (function(){
  try{
    localStorage.setItem('__probe__', '1');
    localStorage.removeItem('__probe__');
    return true;
  }catch(e){ return false; }
})();
function save(){
  if(!STORAGE_OK) return false;
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    return true;
  }catch(e){
    /* 표지 사진을 여러 장 넣으면 공간이 찰 수 있다 — 저장 자체가 막힌 것과 구분한다 */
    var full = e && (e.name === 'QuotaExceededError' ||
                     e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
                     e.code === 22 || e.code === 1014);
    if(full) return false;
    STORAGE_OK = false;
    render();
    return false;
  }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ 날짜 ============ */
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function parseISO(s){ var a = s.split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function addDays(s, n){ var d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a, b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
var DOW = ['일','월','화','수','목','금','토'];
function korDate(s){ var d = parseISO(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]+'요일'; }
function shortDate(s){ var d = parseISO(s); return (d.getMonth()+1)+'/'+d.getDate(); }

/* ============ 시간 표기 ============ */
function clockText(sec){
  var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return pad(h)+':'+pad(m)+':'+pad(s);
}
function durText(sec){
  if(sec < 60) return '0분';
  var h = Math.floor(sec/3600), m = Math.round(sec%3600/60);
  if(h && m) return h+'시간 '+m+'분';
  if(h) return h+'시간';
  return m+'분';
}

/* ============ 계산 ============ */
function book(id){ return S.books.filter(function(b){ return b.id===id; })[0]; }
function bookSessions(id){ return S.sessions.filter(function(s){ return s.bookId===id; }); }
function secOn(date){
  return S.sessions.filter(function(s){ return s.date===date; })
                   .reduce(function(a,s){ return a+s.seconds; }, 0);
}
function bookSeconds(id){
  return bookSessions(id).reduce(function(a,s){ return a+s.seconds; }, 0);
}
function streak(){
  var days = {};
  S.sessions.forEach(function(s){ days[s.date] = 1; });
  var d = today();
  if(!days[d]) d = addDays(d, -1);
  var n = 0;
  while(days[d]){ n++; d = addDays(d, -1); }
  return n;
}
function doneThisMonth(){
  var p = today().slice(0,7);
  return S.books.filter(function(b){ return b.status==='done' && b.finishedAt && b.finishedAt.slice(0,7)===p; }).length;
}
function activeBook(){
  var reading = S.books.filter(function(b){ return b.status==='reading'; });
  if(!reading.length) return null;
  reading.sort(function(a,b){ return (b.lastRead||'').localeCompare(a.lastRead||''); });
  return reading[0];
}

/* 완독 플랜 계산 — 매일 남은 쪽수 ÷ 남은 날로 다시 나눈다 */
function planInfo(b){
  if(!b.plan) return null;
  var t = today();
  var readToday = S.sessions
    .filter(function(s){ return s.bookId===b.id && s.date===t; })
    .reduce(function(a,s){ return a + Math.max(0, s.endPage - s.startPage); }, 0);
  var dayStart = Math.max(0, b.currentPage - readToday);
  var remain = Math.max(0, b.pages - dayStart);
  var daysLeft = diffDays(t, b.plan.target) + 1;
  var over = daysLeft < 1;
  if(daysLeft < 1) daysLeft = 1;
  var perDay = remain > 0 ? Math.ceil(remain / daysLeft) : 0;
  var from = dayStart + 1;
  var to = Math.min(b.pages, dayStart + perDay);
  var left = Math.max(0, to - b.currentPage);

  var totalDays = diffDays(b.plan.start, b.plan.target) + 1;
  var origPerDay = totalDays > 0 ? Math.ceil(b.pages / totalDays) : 0;

  var readDates = {};
  bookSessions(b.id).forEach(function(s){ readDates[s.date] = 1; });
  var skipped = [];
  for(var d = b.plan.start; diffDays(d, t) > 0; d = addDays(d, 1)){
    if(!readDates[d]) skipped.push(d);
  }
  return { from:from, to:to, perDay:perDay, left:left, daysLeft:daysLeft, over:over,
           origPerDay:origPerDay, skipped:skipped, dayStart:dayStart, remain:remain };
}

/* ============ 타이머 ============ */
var TM = { bookId:null, base:0, startedAt:null, running:false, tick:null, startPage:0 };

function startTimer(id){
  var b = book(id);
  if(!b) return;
  TM.bookId = id; TM.base = 0; TM.startedAt = Date.now(); TM.running = true;
  TM.startPage = b.currentPage;
  document.getElementById('tmBook').textContent = b.title;
  document.getElementById('timer').classList.add('on');
  document.getElementById('tmPause').textContent = '일시정지';
  renderClock();
  TM.tick = setInterval(renderClock, 250);
}
function tmSeconds(){
  return Math.floor(TM.base + (TM.running ? (Date.now() - TM.startedAt)/1000 : 0));
}
function renderClock(){
  document.getElementById('tmClock').textContent = clockText(tmSeconds());
  var b = book(TM.bookId);
  /* 링은 이 책의 누적 진행률을 보여준다 */
  var pct = (b && b.pages) ? Math.round(b.currentPage / b.pages * 100) : 0;
  document.getElementById('tmRing').style.background =
    'conic-gradient(var(--green) 0 ' + pct + '%, rgba(255,255,255,.12) 0)';
  document.getElementById('tmPgs').textContent =
    b ? (pct + '% · ' + b.currentPage + ' / ' + b.pages + '쪽') : '';
  var acc = secOn(today()) + tmSeconds();
  document.getElementById('tmAcc').textContent =
    '오늘 누적 ' + durText(acc) + ' · 이 책에 ' + durText(bookSeconds(TM.bookId) + tmSeconds());
}
function pauseTimer(){
  var btn = document.getElementById('tmPause');
  if(TM.running){
    TM.base = tmSeconds(); TM.running = false; btn.textContent = '이어서 읽기';
  }else{
    TM.startedAt = Date.now(); TM.running = true; btn.textContent = '일시정지';
  }
  renderClock();
}
function stopTimer(){
  if(TM.running){ TM.base = tmSeconds(); TM.running = false; }
  clearInterval(TM.tick);
  var sec = tmSeconds();
  document.getElementById('timer').classList.remove('on');
  openStopSheet(sec);
}
/* ============ 화면 그리기 ============ */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function el(id){ return document.getElementById(id); }

/* 표지 색 6가지 (화면과 인증 이미지가 같은 색을 쓴다) */
var PAL = [['#a8562f','#7d3d20'],['#7f9068','#586848'],['#b5894a','#8a6229'],
           ['#8a7c6b','#5f5448'],['#9c6b5c','#6f463a'],['#a35a56','#77393a']];

/* 표지 — 직접 올린 사진 > 알라딘 표지 > 색 + 제목 순서로 쓴다 */
function coverPic(b){ return b.photo || b.coverUrl || ''; }
/* 그림 뒤에 색 표지를 한 겹 깔아둔다.
   인터넷이 끊기거나 표지 주소가 죽어도 깨진 아이콘 대신 색 표지가 보인다. */
function coverBg(src, n){
  var p = PAL[n] || PAL[0];
  var grad = 'linear-gradient(160deg,'+p[0]+','+p[1]+')';
  return 'background-image:' + (src ? 'url(\''+esc(src)+'\'),' : '') + grad;
}
function coverHtml(b, extra){
  var cls = extra ? ' '+extra : '';
  var src = coverPic(b);
  if(src){
    return '<div class="cv ph'+cls+'" style="'+coverBg(src, b.cover||0)+'"></div>';
  }
  return '<div class="cv c'+(b.cover||0)+cls+'">'+esc(b.title)+'</div>';
}
function finBadge(b){
  var src = coverPic(b);
  if(src){
    return '<span class="fin ph" style="'+coverBg(src, b.cover||0)+'"></span>';
  }
  return '<span class="fin c'+(b.cover||0)+'"></span>';
}

/* 폰 사진은 그대로 담으면 저장 공간을 넘겨서, 표지 크기로 줄여 담는다 */
var PHOTO_W = 240, PHOTO_H = 336;
/* 가운데를 잘라 표지 비율로 맞춘 뒤 압축한다 (그림 소스는 img/canvas 모두 가능) */
function resizeToCover(src, w, h){
  var sw = src.naturalWidth || src.width;
  var sh = src.naturalHeight || src.height;
  if(!sw || !sh) return null;
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var x = c.getContext('2d');
  var s = Math.max(w / sw, h / sh);
  var dw = sw * s, dh = sh * s;
  x.drawImage(src, (w - dw)/2, (h - dh)/2, dw, dh);
  return c.toDataURL('image/jpeg', 0.72);
}
function shrinkPhoto(file, cb){
  var url = URL.createObjectURL(file);
  var img = new Image();
  var done = false;
  function finish(result){
    if(done) return;
    done = true;
    URL.revokeObjectURL(url);
    cb(result);
  }
  img.onerror = function(){ finish(null); };
  img.onload = function(){
    try{ finish(resizeToCover(img, PHOTO_W, PHOTO_H)); }
    catch(e){ finish(null); }
  };
  img.src = url;
}
function view(html){
  var warn = STORAGE_OK ? '' :
    '<div class="warn">⚠ 지금 이 화면에서는 <b>기록이 저장되지 않아요</b><br>'+
    '창을 닫으면 사라져요. 설정 → <b>기록 내보내기</b>로 파일 백업을 꼭 해주세요.</div>';
  el('view').innerHTML = warn + html;
  window.scrollTo(0,0);
}

var TABS = [
  { id:'home',     ic:'●', label:'오늘' },
  { id:'calendar', ic:'▦', label:'캘린더' },
  { id:'shelf',    ic:'▤', label:'책장' },
  { id:'settings', ic:'○', label:'설정' }
];
function renderTabs(){
  el('tabbar').innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t.id+'" class="'+(UI.tab===t.id?'on':'')+'">'+
           '<span class="ic">'+t.ic+'</span>'+t.label+'</button>';
  }).join('');
}

function render(){
  renderTabs();
  /* 탭 하나만 알려주면 색은 CSS가 알아서 바꾼다 (책 상세는 책장 색을 따른다) */
  document.getElementById('app').dataset.surface =
    (UI.bookId && book(UI.bookId)) ? 'shelf' : UI.tab;
  if(UI.bookId && book(UI.bookId)) return renderDetail();
  UI.bookId = null;
  if(UI.tab==='home') return renderHome();
  if(UI.tab==='calendar') return renderCalendar();
  if(UI.tab==='shelf') return renderShelf();
  if(UI.tab==='settings') return renderSettings();
}

/* ---------- 홈 ---------- */
function renderHome(){
  var b = activeBook();
  var t = today();
  var h = '<h1 class="head">오늘</h1><p class="sub">'+korDate(t)+'</p>';

  if(!b){
    h += '<div class="empty"><span class="big">▤</span>'+
         '아직 읽는 중인 책이 없어요.<br>책을 먼저 등록해주세요.</div>'+
         '<button class="btn" data-act="add">책 등록하기</button>';
  }else{
    var pct = b.pages ? Math.round(b.currentPage / b.pages * 100) : 0;
    h += '<div class="now">'+
         coverHtml(b)+
         '<div style="min-width:0">'+
           '<p class="t">'+esc(b.title)+'</p>'+
           '<p class="a">'+esc(b.author||'저자 미상')+'</p>'+
           '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
           '<div class="pgrow"><span class="pg">'+b.currentPage+' / '+b.pages+'쪽</span>'+
           '<span class="pgpct">'+pct+'%</span></div>'+
         '</div></div>';

    var pi = planInfo(b);
    var label = b.currentPage>0 ? '이어서 읽기' : '읽기 시작';
    if(pi && pi.perDay > 0){
      h += '<div class="quota"><div>'+
           '<span class="lb">완 독 플 랜 · 오 늘 몫</span>'+
           '<span class="vl">'+pi.from+' – '+pi.to+'쪽</span></div>'+
           '<span class="rest">'+(pi.left>0 ? pi.left+'쪽<br>남았어요' : '오늘 몫<br>다 읽었어요')+'</span></div>'+
           '<button class="startbtn att" data-act="start"><span class="big">▶  '+label+'</span>'+
           '<span class="sm">눌러서 타이머를 켜요</span></button>';
    }else{
      h += '<button class="startbtn" data-act="start"><span class="big">▶  '+label+'</span>'+
           '<span class="sm">눌러서 타이머를 켜요</span></button>';
    }

    h += '<div class="stat3">'+
         '<div><span class="v">'+durText(secOn(t))+'</span><span class="k">오늘 읽은 시간</span></div>'+
         '<div><span class="v">'+streak()+'일</span><span class="k">연속 기록</span></div>'+
         '<div><span class="v">'+doneThisMonth()+'권</span><span class="k">이번 달 완독</span></div>'+
         '</div>';

    var others = S.books.filter(function(x){ return x.status==='reading' && x.id!==b.id; });
    if(others.length){
      h += '<div class="sect">읽는 중인 다른 책</div>' + others.map(function(x){
        return '<div class="kv" data-book="'+x.id+'" style="cursor:pointer">'+
               '<span class="k">'+esc(x.title)+'</span>'+
               '<span class="v">'+x.currentPage+'/'+x.pages+'쪽</span></div>';
      }).join('');
    }
  }
  view(h);
}

/* ---------- 캘린더 ---------- */
function level(sec){
  if(sec <= 0) return '';
  if(sec < 900) return 'l1';
  if(sec < 1800) return 'l2';
  if(sec < 3600) return 'l3';
  return 'l4';
}
function renderCalendar(){
  if(!UI.calMonth) UI.calMonth = today().slice(0,7);
  var ym = UI.calMonth.split('-').map(Number);
  var year = ym[0], mon = ym[1];
  var lead = new Date(year, mon-1, 1).getDay();
  var days = new Date(year, mon, 0).getDate();

  var h = '<h1 class="head">완독 캘린더</h1><p class="sub">색이 진할수록 오래 읽은 날이에요</p>';
  h += '<div class="mhead"><button data-mon="-1">◀</button>'+
       '<span class="m">'+year+'년 '+mon+'월</span>'+
       '<button data-mon="1">▶</button></div>';
  h += '<div class="dow">'+DOW.map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>';

  var cells = '';
  for(var i=0; i<lead; i++) cells += '<div class="cell"></div>';
  var totSec = 0, readDays = 0, fin = 0;
  for(var d=1; d<=days; d++){
    var ds = year+'-'+pad(mon)+'-'+pad(d);
    var sec = secOn(ds);
    totSec += sec;
    if(sec > 0) readDays++;

/* ---------- 책 상세 ---------- */
function planCells(b, pi){
  var t = today(), start = b.plan.start, target = b.plan.target;
  var gridStart = addDays(start, -parseISO(start).getDay());
  var gridEnd = addDays(target, 6 - parseISO(target).getDay());
  var readBy = {};
  bookSessions(b.id).forEach(function(s){
    readBy[s.date] = (readBy[s.date]||0) + Math.max(0, s.endPage - s.startPage);
  });
  var cursor = pi.to, out = [];
  for(var d = gridStart; diffDays(d, gridEnd) >= 0; d = addDays(d, 1)){
    var inPlan = diffDays(start, d) >= 0 && diffDays(d, target) >= 0;
    var cls = 'pc', txt = '', dn = parseISO(d).getDate();
    if(!inPlan){
      cls += ' dim';
    }else if(diffDays(d, t) > 0){
      if(readBy[d]) txt = readBy[d]+'쪽';
      else { cls += ' skip'; txt = '건너뜀'; }
    }else if(d === t){
      cls += ' today'; txt = pi.from+'–'+pi.to;
    }else{
      var from = cursor + 1;
      if(from > b.pages){ cls += ' fin2'; txt = '✓'; }
      else {
        var to = (d === target) ? b.pages : Math.min(b.pages, cursor + pi.perDay);
        txt = from+'–'+to; cursor = to;
        if(d === target){ cls += ' fin2'; txt = '완독!'; }
      }
    }
    out.push('<div class="'+cls+'"><span class="dt">'+dn+'</span>'+
             (txt ? '<span class="pp">'+txt+'</span>' : '')+'</div>');
  }
  return out.join('');
}

  );
  el('finChk').onclick = function(){ this.classList.toggle('on'); };
}
function saveSession(sec){
  var b = book(TM.bookId);
  if(!b){ closeSheet(); return; }
  var input = parseInt(el('endPage').value, 10);
  if(isNaN(input)) input = TM.startPage;
  var endPage = Math.max(0, Math.min(b.pages, input));
  var finished = el('finChk').classList.contains('on') || endPage >= b.pages;

  S.sessions.push({ id:uid(), bookId:b.id, date:today(), seconds:sec,
                    startPage:TM.startPage, endPage:endPage });
  b.currentPage = Math.max(b.currentPage, endPage);
  b.lastRead = today();
  if(finished){
    b.status = 'done';
    b.currentPage = b.pages;
    b.finishedAt = today();
  }
  save(); closeSheet(); render();
  if(finished) openProof(b);
}

/* ============ 책 검색 (알라딘) ============ */
/* 표지 DB는 우리 서버(/api/book)를 거쳐서 받는다 — 알라딘을 직접 부르지 않는다.
   파일로 열었을 때(file://)는 부를 서버가 없어서 검색 대신 안내만 한다. */
var BOOK_API = /^https?:$/.test(location.protocol) ? '/api/book' : null;
var SRCH = { timer:null, seq:0, list:[] };

function srchMsg(html, cls){
  var box = el('srch');
  if(!box) return;
  box.innerHTML = html ? '<p class="msg'+(cls?' '+cls:'')+'">'+html+'</p>' : '';
}
/* 제목칸에 글자를 넣으면 400밀리초 쉬었다가 찾는다 (칠 때마다 부르지 않게) */
function startSearchBox(){
  var ti = el('fTitle');
  if(!ti) return;
  SRCH.seq++; SRCH.list = [];
  clearTimeout(SRCH.timer);
  if(!BOOK_API){
    srchMsg('여기서는 책 검색이 안 돼요. 아래에 직접 입력해주세요.');
    return;
  }
  srchMsg('');
  ti.addEventListener('input', function(){
    var q = this.value.trim();
    clearTimeout(SRCH.timer);
    SRCH.seq++;                       /* 오는 중이던 옛 결과는 버린다 */
    if(q.length < 2){ srchMsg(''); return; }
    SRCH.timer = setTimeout(function(){ runSearch(q); }, 400);
  });
}
function runSearch(q){
  var my = ++SRCH.seq;
  srchMsg('<span class="dots"></span>책을 찾는 중…');
  fetch(BOOK_API + '?q=' + encodeURIComponent(q))
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(list){
      if(my !== SRCH.seq) return;     /* 그새 더 친 글자가 있으면 이 결과는 버린다 */
      drawResults(Array.isArray(list) ? list : []);
    })
    .catch(function(){
      if(my !== SRCH.seq) return;
      srchMsg('검색에 실패했어요. 잠시 후 다시 시도해주세요.', 'err');
    });
}
function drawResults(list){
  var box = el('srch');
  if(!box) return;
  SRCH.list = list;
  if(!list.length){ srchMsg('검색 결과가 없어요. 직접 입력해주세요.'); return; }

  box.innerHTML = '<div class="list">' + list.map(function(bk, i){
    /* 같은 isbn13이 이미 책장에 있으면 알려준다 */
    var known = bk.isbn13 && S.books.some(function(x){ return x.isbn13 === bk.isbn13; });
    var sub = [bk.author, bk.publisher].filter(Boolean).join(' · ');
    return '<button type="button" class="bkc" data-pick="'+i+'">'+
             '<span class="th" style="'+coverBg(bk.cover||'', i%6)+'"></span>'+
             '<span class="tx"><span class="nm">'+esc(bk.title)+'</span>'+
             '<span class="ap">'+esc(sub)+'</span></span>'+
             (known ? '<span class="bdg">등록됨</span>' : '')+
           '</button>';
  }).join('') + '</div>';

  box.onclick = function(e){
    var t = e.target.closest('[data-pick]');
    if(t) pickResult(parseInt(t.dataset.pick, 10));
  };
}
/* 카드를 고르면 isbn13으로 한 번 더 물어본다 — 쪽수는 여기서만 나온다 */
function pickResult(i){
  var bk = SRCH.list[i];
  if(!bk) return;
  fillForm(bk);
  if(!bk.isbn13){
    setPages(null);
    srchMsg('책 정보를 채웠어요. 값은 아래에서 고칠 수 있어요.');
    return;
  }
  var my = ++SRCH.seq;
  srchMsg('<span class="dots"></span>쪽수를 불러오는 중…');
  fetch(BOOK_API + '?isbn13=' + encodeURIComponent(bk.isbn13))
    .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
    .then(function(d){
      if(my !== SRCH.seq) return;
      if(d && d.title) fillForm(d);   /* 상세 정보가 더 정확하다 */
      setPages(d ? d.totalPages : null);
      srchMsg('책 정보를 채웠어요. 값은 아래에서 고칠 수 있어요.');
    })
    .catch(function(){
      if(my !== SRCH.seq) return;
      setPages(null);
      srchMsg('상세 정보를 못 받았어요. 쪽수를 직접 입력해주세요.', 'err');
    });
}
/* 받아온 값을 폼에 넣는다 — 넣은 뒤에도 사용자가 모두 고칠 수 있다 */
function fillForm(d){
  if(d.title     && el('fTitle'))     el('fTitle').value = d.title;
  if(d.author    && el('fAuthor'))    el('fAuthor').value = d.author;
  if(d.publisher && el('fPublisher')) el('fPublisher').value = d.publisher;
  if(d.isbn13) SHEET_PICK.isbn13 = d.isbn13;
  if(d.cover){ SHEET_PICK.coverUrl = d.cover; SHEET_PHOTO = null; }
  drawCoverPreview();
}
function setPages(n){
  var f = el('fPages'), h = el('pageHint');
  if(!f) return;
  if(n && n > 0){
    f.value = n;
    if(h){ h.style.display = 'none'; h.textContent = ''; }
  }else{
    f.value = '';
    if(h){ h.style.display = 'block'; h.textContent = '쪽수 정보가 없어요. 직접 입력해주세요'; }
  }
}

/* 통계를 낼 때 항목이 갈리지 않도록 목록에서만 고르게 한다.
   저장은 id로 하니까 나중에 이름을 바꿔도 쌓인 기록이 안 깨진다. */
var GENRES = [
  { id:'lit',   label:'문학·소설' },
  { id:'essay', label:'에세이' },
  { id:'human', label:'인문·역사' },
  { id:'self',  label:'자기계발' },
  { id:'biz',   label:'경제·경영' },
  { id:'etc',   label:'기타' }
];
function genreLabel(id){
  var g = GENRES.filter(function(x){ return x.id === id; })[0];
  return g ? g.label : '미분류';
}
function genreOptions(sel){
  return '<option value="">미분류</option>' + GENRES.map(function(g){
    return '<option value="'+g.id+'"'+(g.id===sel?' selected':'')+'>'+g.label+'</option>';
  }).join('');
}

var SHEET_PHOTO = null;
var SHEET_PICK = { isbn13:'', coverUrl:'' };
function drawCoverPreview(){
  var p = el('cvPrev');
  if(!p) return;
  var title = (el('fTitle') && el('fTitle').value.trim()) || '표지';
  var on = el('swatch') ? el('swatch').querySelector('.on') : null;
  var cover = on ? parseInt(on.dataset.cover, 10) : 0;
  p.innerHTML = coverHtml({ photo:SHEET_PHOTO, coverUrl:SHEET_PICK.coverUrl,
                            cover:cover, title:title });
  var cv = p.firstChild;
  if(cv){ cv.style.width = '100%'; cv.style.height = '100%'; }
  var rm = el('rmPhoto');
  if(rm) rm.style.display = (SHEET_PHOTO || SHEET_PICK.coverUrl) ? 'block' : 'none';
}
function saveBook(id){
  var title = el('fTitle').value.trim();
  var pages = parseInt(el('fPages').value, 10);
  if(!title){ alert('제목을 입력해주세요.'); return; }
  if(!pages || pages < 1){ alert('총 쪽수를 숫자로 입력해주세요.'); return; }
  var coverBtn = el('swatch').querySelector('.on');
  var cover = coverBtn ? parseInt(coverBtn.dataset.cover, 10) : 0;
  var status = el('fStatus').value;
  var b = id ? book(id) : null;

  var author    = el('fAuthor').value.trim();
  var publisher = el('fPublisher') ? el('fPublisher').value.trim() : '';
  var genre     = el('fGenre') ? el('fGenre').value : '';

  if(b){
    b.title = title; b.author = author; b.publisher = publisher; b.genre = genre;
    b.pages = pages; b.cover = cover;
    var cur = parseInt(el('fCur').value, 10);
    b.currentPage = Math.max(0, Math.min(pages, isNaN(cur)?b.currentPage:cur));
    if(status === 'done'){
      b.currentPage = pages;
      if(!b.finishedAt) b.finishedAt = today();
    }else{
      b.finishedAt = null;
    }
    b.status = status;
    b.photo = SHEET_PHOTO;
    b.isbn13 = SHEET_PICK.isbn13 || '';
    b.coverUrl = SHEET_PICK.coverUrl || '';
  }else{
    b = { id:uid(), title:title, author:author, publisher:publisher, pages:pages, genre:genre,
          isbn13:SHEET_PICK.isbn13||'', coverUrl:SHEET_PICK.coverUrl||'',
          cover:cover, photo:SHEET_PHOTO, status:status,
          currentPage: status==='done'?pages:0,
          addedAt:today(), finishedAt: status==='done'?today():null,
          rating:0, note:'', plan:null, lastRead:null };
    S.books.push(b);
  }

  if(!save() && b.photo){
    /* 저장 공간이 찼다면 사진만 빼고 다시 담아본다 */
    b.photo = null;
    if(save()) alert('저장 공간이 부족해서 표지 사진은 빼고 저장했어요.\n설정에서 기록을 내보낸 뒤, 오래된 책의 사진을 지워보세요.');
  }
  SHEET_PHOTO = null;
  SHEET_PICK = { isbn13:'', coverUrl:'' };
  closeSheet();
  UI.tab = 'shelf'; UI.shelfTab = b.status; UI.bookId = null;
  render();
}

    el('fTarget').value = addDays(today(), parseInt(t.dataset.quick,10) - 1);
    hint();
  };

function savePlan(id){
  var b = book(id);
  var target = el('fTarget').value;
  if(!target || diffDays(today(), target) < 0){ alert('오늘 이후 날짜를 골라주세요.'); return; }
  b.plan = { start: (b.plan && b.plan.start) || today(), target: target };
  save(); closeSheet(); render();
}

  if(!b) return;
  var text = el('fQuote').value.trim();

  var p = parseInt(el('fQPage').value, 10);

function roundRect(x, l, t, w, h, r){
  x.beginPath();
  x.moveTo(l+r, t);
  x.arcTo(l+w, t, l+w, t+h, r);
  x.arcTo(l+w, t+h, l, t+h, r);
  x.arcTo(l, t+h, l, t, r);
  x.arcTo(l, t, l+w, t, r);
  x.closePath();
}
function wrapText(x, text, cx, y, maxW, lh){
  var words = String(text).split(' '), line = '', lines = [];
  for(var i=0; i<words.length; i++){
    var test = line ? line+' '+words[i] : words[i];
    if(x.measureText(test).width > maxW && line){ lines.push(line); line = words[i]; }
    else line = test;
  }
  if(line) lines.push(line);
  lines.forEach(function(l, i){ x.fillText(l, cx, y + i*lh); });
  return lines.length * lh;
}
function saveProofImage(id){
  var b = book(id);
  var src = coverPic(b);
  if(src){
    var im = new Image();
    /* 알라딘 표지는 다른 서버의 그림이라, 이 표시가 없으면 인증 이미지 저장이 막힌다 */
    if(/^https?:/i.test(src)) im.crossOrigin = 'anonymous';
    im.onload = function(){ drawProof(b, im); };
    im.onerror = function(){ drawProof(b, null); };   /* 표지를 못 받으면 색 표지로 그린다 */
    im.src = src;
  }else{
    drawProof(b, null);
  }
}
/* 완독 도장 — .stamp 의 캔버스 판. 두 곳이 같은 모양이어야 해서 값도 같은 비율로 맞췄다. */
function drawStamp(x, cx, cy, r, dateStr, F){
  x.save();
  x.translate(cx, cy);
  x.rotate(-11 * Math.PI / 180);
  x.textAlign = 'center';

  /* 어긋난 2도 인쇄 — 초록 고리를 먼저, 살짝 밀어서 */
  x.globalAlpha = .36; x.strokeStyle = '#44614F'; x.lineWidth = r*.052;
  x.setLineDash([r*.42, r*.05]);
  x.beginPath(); x.arc(r*.065, r*.065, r, 0, Math.PI*2); x.stroke();

  x.globalAlpha = 1; x.strokeStyle = '#8F3434';
  x.beginPath(); x.arc(0, 0, r, 0, Math.PI*2); x.stroke();
  x.lineWidth = r*.022; x.setLineDash([r*.3, r*.05]);
  x.beginPath(); x.arc(0, 0, r*.85, 0, Math.PI*2); x.stroke();
  x.setLineDash([]);

  x.fillStyle = '#8F3434';
  x.font = 'bold ' + Math.round(r*.55) + 'px ' + F;
  x.fillText('완독', 0, r*.05);
  x.font = 'bold ' + Math.round(r*.195) + 'px ' + F;
  x.fillText(dateStr.slice(5).replace('-', '.'), 0, r*.37);
  x.restore();
}
function drawProof(b, photo){
  var st = proofStats(b);
  var W = 750, H = 1200;
  var c = document.createElement('canvas'); c.width = W; c.height = H;
  var x = c.getContext('2d');
  var F = '"Malgun Gothic","Apple SD Gothic Neo",sans-serif';

  var bg = x.createLinearGradient(0, 0, W*0.35, H);
  bg.addColorStop(0, '#f3ede3'); bg.addColorStop(1, '#eee5d6');
  x.fillStyle = bg; x.fillRect(0, 0, W, H);

  var cw = 210, ch = 296, cx = (W-cw)/2, cy = 120;
  /* 표지 자리에 그림자를 먼저 깔고 */
  x.save();
  x.shadowColor = 'rgba(59,52,44,.28)'; x.shadowBlur = 24; x.shadowOffsetY = 8;
  x.fillStyle = '#fff'; roundRect(x, cx, cy, cw, ch, 12); x.fill();
  x.restore();

  if(photo){
    x.save();
    roundRect(x, cx, cy, cw, ch, 12); x.clip();
    x.drawImage(photo, cx, cy, cw, ch);
    x.restore();
  }else{
    var p = PAL[b.cover] || PAL[0];
    var cg = x.createLinearGradient(cx, cy, cx+cw, cy+ch);
    cg.addColorStop(0, p[0]); cg.addColorStop(1, p[1]);
    x.save();
    roundRect(x, cx, cy, cw, ch, 12); x.clip();
    x.fillStyle = cg; x.fillRect(cx, cy, cw, ch);
    x.restore();
    x.fillStyle = 'rgba(255,255,255,.92)';
    x.font = 'bold 20px '+F; x.textAlign = 'center';
    wrapText(x, b.title, W/2, cy + ch - 28, cw - 28, 24);
  }

  /* 화면 카드와 같은 도장. 카드와 저장본은 표지가 차지하는 비율이 달라서,
     좌표를 그대로 옮기지 않고 표지 크기에 맞춰 잡는다 (표지 오른쪽 모서리에 걸치게). */
  drawStamp(x, cx + cw + cw*0.13, cy + ch*0.74, cw*0.25, b.finishedAt || today(), F);

  x.textAlign = 'center';
  x.fillStyle = '#3b342c'; x.font = 'bold 36px '+F;
  var y = cy + ch + 64;
  y += wrapText(x, b.title, W/2, y, W - 120, 44);
  x.fillStyle = '#a1968a'; x.font = '22px '+F;
  x.fillText(b.author || '', W/2, y + 8);

  y += 64;
  x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(90, y); x.lineTo(W-90, y); x.stroke();

  var kpis = [[st.span+'일','읽은 기간'], [durText(st.sec),'총 읽은 시간'], [b.pages+'쪽','분량']];
  kpis.forEach(function(k, i){
    var kx = W/2 + (i-1) * 200;
    x.fillStyle = '#a8562f'; x.font = 'bold 30px '+F;
    x.fillText(k[0], kx, y + 52);
    x.fillStyle = '#a1968a'; x.font = '18px '+F;
    x.fillText(k[1], kx, y + 82);
  });
  y += 110;
  x.beginPath(); x.moveTo(90, y); x.lineTo(W-90, y); x.stroke();

  y += 56;
  if(b.rating){
    x.fillStyle = '#a8562f'; x.font = '28px '+F;
    x.fillText('★'.repeat(b.rating) + '☆'.repeat(5-b.rating), W/2, y);
    y += 48;
  }
  if(b.note){
    x.fillStyle = '#6b6157'; x.font = '24px '+F;
    y += wrapText(x, '“' + b.note + '”', W/2, y, W - 140, 36);
    y += 24;
  }
  x.fillStyle = '#b9ad9e'; x.font = 'bold 18px '+F;
  x.fillText((b.finishedAt || today()).replace(/-/g, '. '), W/2, H - 70);

  var name = (b.title.replace(/[\\/:*?"<>|]/g, '') || '완독') + '_완독인증.png';
  c.toBlob(function(blob){ saveFile(name, blob, 'image/png'); }, 'image/png');
}

/* ============ 파일 저장 ============ */
/* 링크(아티팩트)로 열었을 때와 파일로 열었을 때의 저장 방식이 달라서 둘 다 지원한다. */
async function saveFile(filename, data, mime){
  try{
    if(typeof claude !== 'undefined' && claude && typeof claude.use === 'function'){
      var dl = await claude.use('downloads');
      if(dl){ await dl.save({ filename: filename, data: data }); return true; }
    }
  }catch(err){
    if(err && err.code === 'declined') return false;
    if(err && (err.code === 'too_large' || err.code === 'rejected_extension')){
      alert('이 파일은 저장할 수 없어요.'); return false;
    }
    /* 그 밖의 이유면 아래 방식으로 한 번 더 시도한다 */
  }
  try{
    var blob = (data instanceof Blob) ? data
             : new Blob([data], { type: mime || 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    return true;
  }catch(e){
    alert('저장하지 못했어요. 잠시 뒤 다시 눌러주세요.');
    return false;
  }
}

/* ============ 백업 ============ */
function exportData(){
  saveFile('독서기록_' + today() + '.json',
           JSON.stringify(S, null, 2), 'application/json');
}
function importData(file){
  var r = new FileReader();
  r.onerror = function(){
    alert('파일을 여는 데 실패했어요.\n다른 위치에 복사한 뒤 다시 시도해주세요.');
  };
  r.onload = function(){
    var p;
    try{
      p = JSON.parse(r.result);
    }catch(e){
      alert('이 파일은 백업 파일이 아니에요.\n고른 파일: ' + file.name +
            '\n\n이름이 "독서기록_"으로 시작하는 파일을 골라주세요.');
      return;
    }
    if(!p || !p.books || !p.sessions){
      alert('백업 파일 형식이 아니에요.\n고른 파일: ' + file.name);
      return;
    }
    if(!confirm('불러올 기록: 책 ' + p.books.length + '권, 기록 ' + p.sessions.length + '번\n\n' +
                '지금 기록을 덮어씁니다. 계속할까요?')) return;
    S.books = p.books; S.sessions = p.sessions;
    normalize();                  /* 옛 백업 파일에 없는 새 항목은 빈 값으로 채운다 */
    if(save()){
      render();
      alert('불러왔어요. 책 ' + S.books.length + '권, 기록 ' + S.sessions.length + '번');
    }else{
      render();
      alert('불러왔지만 저장에 실패했어요. 창을 닫으면 사라질 수 있어요.');
    }
  };
  r.readAsText(file);
}

/* ============ 이벤트 ============ */
document.addEventListener('click', function(e){
  var t;

  if((t = e.target.closest('[data-tab]'))){ UI.tab = t.dataset.tab; UI.bookId = null; return render(); }
  if((t = e.target.closest('[data-shelf]'))){
    UI.shelfTab = t.dataset.shelf; UI.shelfMore = SHELF_STEP; return render();
  }
  if(e.target.closest('[data-act="more"]')){
    UI.shelfMore = (UI.shelfMore || SHELF_STEP) + SHELF_STEP; return render();
  }
  if((t = e.target.closest('[data-mon]'))){
    var ym = UI.calMonth.split('-').map(Number);
    var d = new Date(ym[0], ym[1]-1 + parseInt(t.dataset.mon,10), 1);
    UI.calMonth = d.getFullYear()+'-'+pad(d.getMonth()+1);
    return render();
  }
  if((t = e.target.closest('[data-star]'))){
    var b = book(UI.bookId);
    if(b){ b.rating = parseInt(t.dataset.star,10); save(); render(); }
    return;
  }
  if((t = e.target.closest('[data-book]'))){ UI.bookId = t.dataset.book; return render(); }

  t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.dataset.act, id = t.dataset.id;

  if(act==='add') return openBookSheet(null);
  if(act==='edit') return openBookSheet(id);
  if(act==='saveBook') return saveBook(id);
  if(act==='closeSheet') return closeSheet();
  if(act==='back'){ UI.bookId = null; return render(); }
  if(act==='start'){
    var bid = id || (activeBook() && activeBook().id);
    if(!bid) return alert('먼저 책을 등록해주세요.');
    return startTimer(bid);
  }
  if(act==='saveSession') return saveSession(parseInt(t.dataset.sec,10));
  if(act==='plan') return openPlanSheet(id);
  if(act==='savePlan') return savePlan(id);
  if(act==='unplan'){
    var b2 = book(id); b2.plan = null; save(); return render();
  }
  if(act==='note') return openNoteSheet(id);
  if(act==='saveNote'){
    var b3 = book(id); b3.note = el('fNote').value.trim(); save(); closeSheet(); return render();
  }
  if(act==='quote') return openQuoteSheet(id);
  if(act==='editQuote') return openQuoteSheet(UI.bookId, id);
  if(act==='saveQuote') return saveQuote(id, t.dataset.qid);
  if(act==='delQuote'){
    var bq = book(UI.bookId);
    if(!bq) return;
    if(!confirm('이 문장을 지울까요?')) return;
    bq.quotes = bq.quotes.filter(function(q){ return q.id !== id; });
    save(); return render();
  }
  if(act==='finish'){
    var b4 = book(id);
    if(!confirm('이 책을 완독으로 표시할까요?')) return;
    b4.status = 'done'; b4.currentPage = b4.pages; b4.finishedAt = today();
    save(); render(); return openProof(b4);
  }
  if(act==='proof') return openProof(id);
  if(act==='saveImg') return saveProofImage(id);
  if(act==='export') return exportData();
  if(act==='del'){
    if(!confirm('이 책과 관련된 기록이 모두 지워져요. 삭제할까요?')) return;
    S.books = S.books.filter(function(b){ return b.id !== id; });
    S.sessions = S.sessions.filter(function(s){ return s.bookId !== id; });
    save(); UI.bookId = null; UI.tab = 'shelf'; return render();
  }
  if(act==='reset'){
    if(!confirm('모든 책과 기록이 사라져요. 정말 지울까요?')) return;
    if(!confirm('되돌릴 수 없어요. 한 번 더 확인해주세요.')) return;
    S.books = []; S.sessions = []; save(); UI.bookId = null; return render();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'importFile' && e.target.files[0]){
    var f = e.target.files[0];

});
